name: Library Loans Pytest

on:
  push:
    # Run for changes that can affect this project's tests or test environment.
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/library-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

# Test the latest revision instead of completing an outdated run on this branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests and measure coverage
        run: python -m pytest -v --cov=src --cov-report=term-missing
